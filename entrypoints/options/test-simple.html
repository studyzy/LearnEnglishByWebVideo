<!DOCTYPE html>
<html>
<head>
  <title>Simple Options Test</title>
</head>
<body>
  <h1>Options Test</h1>
  <button id="test-save">Test Save</button>
  <button id="test-load">Test Load</button>
  <div id="output"></div>
  
  <script>
    const output = document.getElementById('output');
    
    function log(msg) {
      console.log(msg);
      output.innerHTML += msg + '<br>';
    }
    
    // Test chrome API availability
    log('Testing Chrome APIs...');
    log('chrome: ' + (typeof chrome));
    log('chrome.storage: ' + (typeof chrome?.storage));
    log('chrome.storage.local: ' + (typeof chrome?.storage?.local));
    
    document.getElementById('test-save').addEventListener('click', async () => {
      try {
        log('Saving test data...');
        await chrome.storage.local.set({ test: 'hello' });
        log('✅ Save successful!');
      } catch (error) {
        log('❌ Save failed: ' + error.message);
      }
    });
    
    document.getElementById('test-load').addEventListener('click', async () => {
      try {
        log('Loading test data...');
        const result = await chrome.storage.local.get('test');
        log('✅ Load successful: ' + JSON.stringify(result));
      } catch (error) {
        log('❌ Load failed: ' + error.message);
      }
    });
  </script>
</body>
</html>
